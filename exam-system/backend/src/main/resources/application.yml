server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/online_exam?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

jwt:
  secret: ReplaceWithAReallyLongSecretKeyForJwtToken1234567890
  expire-minutes: 720

app:
  cors-origins:
    - http://localhost:5173
