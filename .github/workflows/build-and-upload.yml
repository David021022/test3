name: Build And Upload

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: exam-system/frontend/package-lock.json

      - name: Build Backend (Spring Boot)
        working-directory: exam-system/backend
        run: ./mvnw -B clean package -DskipTests

      - name: Build Frontend (Vue3)
        working-directory: exam-system/frontend
        run: |
          npm ci
          npm run build

      - name: Upload Backend Jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: exam-system/backend/target/*.jar
          if-no-files-found: error

      - name: Upload Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: exam-system/frontend/dist
          if-no-files-found: error

